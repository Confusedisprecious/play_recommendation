name: 定时数据更新

on:
  schedule:
    # 每 2 小时刷新一次公开资讯；GitHub 调度高峰期可能有少量延迟。
    - cron: '17 */2 * * *'
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: update-public-travel-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      UPDATE_INTERVAL_HOURS: '2'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 lxml

      - name: 启动 RSSHub（B站视频源，尽力而为）
        continue-on-error: true
        run: |
          # 优先 GHCR 镜像，避开 Docker Hub 对共享 Runner IP 的匿名拉取限流；
          # RSSHub 启动失败只跳过 B站视频源，不阻塞新闻/天气等主数据管道。
          docker pull ghcr.io/diygod/rsshub:chromium-bundled || docker pull diygod/rsshub-chromium-bundled
          IMAGE="ghcr.io/diygod/rsshub:chromium-bundled"
          docker image inspect "$IMAGE" >/dev/null 2>&1 || IMAGE="diygod/rsshub-chromium-bundled"
          docker run -d --name rsshub -p 127.0.0.1:1200:1200 "$IMAGE" || true
          for i in $(seq 1 40); do
            if curl -fsS -m 5 http://127.0.0.1:1200/healthz >/dev/null 2>&1 \
              || curl -fsS -m 5 http://127.0.0.1:1200/ >/dev/null 2>&1; then
              echo "RSSHUB_BASE_URL=http://127.0.0.1:1200" >> "$GITHUB_ENV"
              echo "RSSHub ready"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::RSSHub 未就绪，本轮跳过 B站视频源，其余数据照常更新"

      - name: 运行数据更新脚本
        env:
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: |
          echo "📍 开始更新数据..."
          python scripts/discover_social.py
          python scripts/update_all.py
          python scripts/generate_recommendation.py
          echo "✅ 数据更新完成"

      - name: 关闭 RSSHub
        if: always()
        run: docker rm -f rsshub || true

      - name: 提交更新到仓库
        run: |
          git config user.name "auto-update-bot"
          git config user.email "bot@example.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "🔄 定时数据更新 $(date '+%Y-%m-%d %H:%M') [skip ci]"
          git push
